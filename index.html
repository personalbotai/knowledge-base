<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Base</title>
    <meta name="description" content="A lightweight personal knowledge base with markdown support, tags, and search.">
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen transition-colors duration-300">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <div class="flex justify-between items-center max-w-4xl mx-auto mb-4">
                <h1 class="text-4xl font-bold text-indigo-600">Personal Knowledge Base</h1>
                <div class="flex gap-2">
                    <button id="darkModeToggle" class="p-2 rounded-lg bg-white shadow hover:bg-gray-100 transition-colors" title="Toggle dark mode">
                        <svg id="moonIcon" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <svg id="sunIcon" class="w-6 h-6 text-yellow-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </button>
                    <button id="exportBtn" class="p-2 rounded-lg bg-white shadow hover:bg-gray-100 transition-colors" title="Export notes">
                        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                    <button id="importBtn" class="p-2 rounded-lg bg-white shadow hover:bg-gray-100 transition-colors" title="Import notes">
                        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </button>
                </div>
            </div>
            <input type="text" id="searchInput" placeholder="Search knowledge... (Ctrl+K)" class="w-full max-w-md mx-auto px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent dark:bg-gray-800 dark:border-gray-600 dark:text-white dark:placeholder-gray-400">
            <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                Shortcuts: <kbd class="px-2 py-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-xs">Ctrl+K</kbd> Search, <kbd class="px-2 py-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded text-xs">Ctrl+N</kbd> New Note
            </div>
        </header>
        
        <main class="grid lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 transition-colors">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">My Notes</h2>
                        <select id="tagFilter" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-white text-sm">
                            <option value="">All Tags</option>
                        </select>
                    </div>
                    <div class="notes-grid grid gap-4" id="notesGrid">
                        <div class="note-card bg-indigo-50 dark:bg-gray-700 border-l-4 border-indigo-500 p-4 rounded-lg hover:shadow-md transition-shadow">
                            <h3 class="text-lg font-semibold text-indigo-900 dark:text-indigo-100 mb-2">Welcome to Your Knowledge Base</h3>
                            <div class="note-content text-gray-600 dark:text-gray-300 mb-3"></div>
                            <div class="note-tags flex flex-wrap gap-2 mb-2"></div>
                            <button class="edit-btn mt-2 bg-indigo-600 dark:bg-indigo-500 text-white px-3 py-1 rounded hover:bg-indigo-700 dark:hover:bg-indigo-600 text-sm" onclick="knowledgeBase.editNote('welcome')">Edit</button>
                        </div>
                    </div>
                </div>
            </section>
            
            <section>
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 transition-colors">
                    <h2 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">Add New Note</h2>
                    <form id="addNoteForm" class="space-y-4">
                        <input type="text" id="noteTitle" placeholder="Note title" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent dark:bg-gray-700 dark:text-white dark:placeholder-gray-400">
                        <input type="text" id="noteTags" placeholder="Tags (comma separated)" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent dark:bg-gray-700 dark:text-white dark:placeholder-gray-400">
                        <textarea id="noteContent" placeholder="Note content (Markdown supported)" rows="5" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"></textarea>
                        <button type="submit" class="w-full bg-indigo-600 dark:bg-indigo-500 text-white py-2 rounded-lg hover:bg-indigo-700 dark:hover:bg-indigo-600 transition-colors font-semibold">Add Note</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    
    <!-- Hidden file input for import -->
    <input type="file" id="importFileInput" accept=".json,.md,.txt" class="hidden">
    
    <script src="app.js"></script>
</body>
</html>
