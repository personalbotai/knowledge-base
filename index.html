<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Base</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-600 mb-4">Personal Knowledge Base</h1>
            <input type="text" id="searchInput" placeholder="Search knowledge..." class="w-full max-w-md mx-auto px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </header>
        
        <main class="grid lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold text-indigo-600 mb-4">My Notes</h2>
                    <div class="notes-grid grid gap-4" id="notesGrid">
                        <div class="note-card bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-lg hover:shadow-md transition-shadow">
                            <h3 class="text-lg font-semibold text-indigo-900 mb-2">Welcome to Your Knowledge Base</h3>
                            <p class="text-gray-600">This is your personal space for storing and organizing knowledge. Add notes, search through them, and keep your thoughts organized.</p>
                            <button class="edit-btn mt-2 bg-indigo-600 text-white px-3 py-1 rounded hover:bg-indigo-700 text-sm" onclick="knowledgeBase.editNote('welcome')">Edit</button>
                        </div>
                    </div>
                </div>
            </section>
            
            <section>
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold text-indigo-600 mb-4">Add New Note</h2>
                    <form id="addNoteForm" class="space-y-4">
                        <input type="text" id="noteTitle" placeholder="Note title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <textarea id="noteContent" placeholder="Note content" rows="5" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">Add Note</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
